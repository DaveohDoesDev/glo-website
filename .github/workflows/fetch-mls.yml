name: Fetch MLS Listings

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  fetch-listings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch MLS data from Spark API
        env:
          SPARK_API_TOKEN: ${{ secrets.SPARK_API_TOKEN }}
        run: node scripts/fetch-listings.js

      - name: Commit and push updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/featured.json
          if git diff --cached --quiet; then
            echo "No changes to listings data."
          else
            git commit -m "Update MLS listings data [automated]"
            git push
          fi

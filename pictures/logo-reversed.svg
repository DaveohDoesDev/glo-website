<!-- Gloria Rossi Realty — Full Brand Wordmark Reversed (for dark/navy backgrounds) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">

  <!-- ===== MARK ===== -->

  <!-- Left thin rule -->
  <line x1="20" y1="60" x2="128" y2="60" stroke="#c5a028" stroke-width="0.75"/>

  <!-- Orbital arc -->
  <path d="M 140 80 Q 180 20 220 34" stroke="#c5a028" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Dot -->
  <circle cx="220" cy="34" r="3.2" fill="#c5a028"/>

  <!-- Right thin rule -->
  <line x1="232" y1="60" x2="340" y2="60" stroke="#c5a028" stroke-width="0.75"/>

  <!-- GR Monogram — white on dark -->
  <text x="180" y="100"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="52"
    font-weight="normal"
    fill="rgba(255,255,255,0.92)"
    text-anchor="middle"
    letter-spacing="8">GR</text>

  <!-- ===== WORDMARK ===== -->

  <line x1="60" y1="118" x2="300" y2="118" stroke="#c5a028" stroke-width="0.6"/>

  <text x="180" y="144"
    font-family="'Trebuchet MS', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="17"
    font-weight="normal"
    fill="rgba(255,255,255,0.90)"
    text-anchor="middle"
    letter-spacing="11">GLORIA ROSSI</text>

  <line x1="110" y1="156" x2="250" y2="156" stroke="#c5a028" stroke-width="0.4"/>

  <text x="180" y="174"
    font-family="'Trebuchet MS', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="8"
    fill="rgba(255,255,255,0.45)"
    text-anchor="middle"
    letter-spacing="4">LUXURY REAL ESTATE · SPACE COAST, FLORIDA</text>

</svg>
